name: Offline validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Official worked example and reference checks
        run: |
          bash run.sh example /tmp/xpert-example.json --telemetry /tmp/xpert-telemetry.json
          python check.py example /tmp/xpert-example.json
          python -m scripts.evaluate_official example /tmp/xpert-example.json
      - name: Caller-relative paths with spaces
        run: |
          mkdir -p '/tmp/xpert input'
          cp example/chats.jsonl example/messages.jsonl '/tmp/xpert input/'
          cd /tmp
          bash "$GITHUB_WORKSPACE/run.sh" 'xpert input' 'xpert output/result.json'
          python "$GITHUB_WORKSPACE/check.py" 'xpert input' 'xpert output/result.json'
  clean-container:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Official two-argument command in a clean container
        run: |
          bash run.sh example /tmp/xpert-container.json
          python check.py example /tmp/xpert-container.json
          python -S -m src.cli example /tmp/xpert-stdlib.json
          python check.py example /tmp/xpert-stdlib.json
